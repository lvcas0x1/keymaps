<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyboard Shortcuts Dashboard</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1 id="title">Keyboard Shortcuts Dashboard</h1>
        <div id="subtitle" class="subtitle">Karabiner → Hammerspoon → WezTerm → Neovim</div>
        <div id="updated" class="subtitle"></div>
      </div>
      <input id="search" class="search" type="search" placeholder="Search shortcuts..." autocomplete="off" />
    </div>
  </header>

  <main class="container">
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <div id="empty" class="empty">No shortcuts matched your search.</div>
    <div id="app"></div>
  </main>

  <footer class="footer">
    Catppuccin Latte inspired. Data-driven with JSON for easy updates.
  </footer>

  <script src="./assets/app.js"></script>
</body>
</html>
